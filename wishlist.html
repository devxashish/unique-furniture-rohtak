<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saved Wishlist — Unique Furniture Rohtak</title>
  <link rel="stylesheet" href="styles/main.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand-logo">
        <span class="brand-name">UNIQUE FURNITURE</span>
        <span class="brand-locality">ROHTAK • WISHLIST</span>
      </a>
      <nav class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="shop.html" class="nav-link">Shop Collection</a>
        <a href="custom-furniture.html" class="nav-link">Custom Studio</a>
        <a href="reviews.html" class="nav-link">Rohtak Reviews</a>
        <a href="store.html" class="nav-link">Our Showroom</a>
      </nav>
      <div class="header-actions">
        <button class="action-btn open-cart-btn"><i data-lucide="shopping-bag" style="width: 20px; height: 20px;"></i><span class="action-badge cart-count-badge" style="display: none;">0</span></button>
      </div>
    </div>
  </header>

  <section class="section">
    <div class="container">
      <h1 style="font-size: 2.25rem; margin-bottom: 2rem;">Saved Wishlist Items</h1>
      <div class="products-grid" id="wishlist-grid">
        <!-- Injected by JS -->
      </div>
    </div>
  </section>

  <!-- Mini-Cart Drawer -->
  <div id="drawer-backdrop" class="drawer-backdrop"></div>
  <div id="cart-drawer" class="cart-drawer">
    <div class="drawer-header"><div class="drawer-title">Shopping Bag</div><button class="drawer-close-btn close-cart-btn"><i data-lucide="x" style="width: 20px; height: 20px;"></i></button></div>
    <div class="drawer-body" id="cart-drawer-items"></div>
    <div class="drawer-footer" id="cart-drawer-footer-actions">
      <div style="display: flex; justify-content: space-between; font-size: 1.15rem; font-weight: 700; margin-bottom: 1.25rem;"><span>Total:</span><span id="cart-drawer-total">₹0</span></div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;"><a href="cart.html" class="btn-outline" style="padding: 0.75rem 0.5rem; text-align: center;">View Bag</a><a href="checkout.html" class="btn-gold" style="padding: 0.75rem 0.5rem; text-align: center;">Checkout</a></div>
    </div>
  </div>

  <script src="js/store.js"></script>
  <script src="js/commerce-adapter.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.store.subscribe('wishlist:updated', renderWishlist);
      window.store.subscribe('store:ready', renderWishlist);
      renderWishlist();
    });

    function renderWishlist() {
      const grid = document.getElementById('wishlist-grid');
      if (!grid) return;

      const items = window.store.state.wishlist;
      if (items.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 4rem 1rem; background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm);">
            <i data-lucide="heart" style="width: 48px; height: 48px; color: var(--text-tertiary); margin: 0 auto 1rem;"></i>
            <h3 style="font-size: 1.25rem; margin-bottom: 0.5rem;">Your Wishlist is Empty</h3>
            <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">Save your favorite furniture pieces while exploring our catalogue.</p>
            <a href="shop.html" class="btn-primary">Browse Catalogue</a>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      grid.innerHTML = items.map(p => `
        <div class="product-card">
          <div class="product-thumb">
            <a href="product.html?slug=${p.slug}"><img src="${p.images[0]}" alt="${p.name}"></a>
            <button class="product-wishlist-btn active" onclick="removeFromWishlist('${p.id}')" title="Remove">✕</button>
          </div>
          <div class="product-info">
            <h4 class="product-title"><a href="product.html?slug=${p.slug}">${p.name}</a></h4>
            <div class="product-price-row"><span class="product-price">₹${p.price.toLocaleString('en-IN')}</span></div>
            <button class="btn-primary" style="width: 100%; padding: 0.75rem;" onclick="moveToCart('${p.id}')">
              <i data-lucide="shopping-bag" style="width: 16px; height: 16px;"></i>
              <span>Move to Bag</span>
            </button>
          </div>
        </div>
      `).join('');

      lucide.createIcons();
    }

    function removeFromWishlist(id) {
      const p = window.store.state.products.find(x => x.id === id);
      if (p) window.store.toggleWishlist(p);
    }

    function moveToCart(id) {
      const p = window.store.state.products.find(x => x.id === id);
      if (p) {
        window.store.addToCart(p, 1);
        window.store.toggleWishlist(p);
        window.showToast(`Moved ${p.name} to your bag!`, 'success');
        window.openMiniCart();
      }
    }
  </script>
</body>
</html>
